name: Update Profile Contribution Art

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch latest contributions
        run: |
          python scripts/fetch_contributions.py

      - name: Render updated contribution heatmaps
        run: |
          python scripts/render_heatmap_svg.py --both

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-heatmap.svg assets/contribution-heatmap-static.svg
          if git diff --staged --quiet; then
            echo "No changes to commit. Contribution heatmap is up to date."
          else
            git commit -m "chore(profile): update contribution heatmap [skip ci]"
            git push
          fi
