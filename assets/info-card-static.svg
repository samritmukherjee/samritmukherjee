    <text x="188" y="348" class="meta" opacity="1"><tspan fill="#79c0ff" font-weight="600">Achievements</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#ffbd2e">11 Hackathon Wins</tspan></text>
    <text x="188" y="372" class="meta" opacity="1"><tspan fill="#79c0ff" font-weight="600">Global Rank </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#e3b341">Top 106: Google Solution Challenge 2026</tspan></text>
    <text x="188" y="396" class="meta" opacity="1"><tspan fill="#79c0ff" font-weight="600">Portfolio   </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#58a6ff">https://samrit.dev/</tspan></text>
