<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <defs>
    <filter id="panelGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .window-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .title-bar { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
    .title-text { fill: #8b949e; font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .prompt { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 500; }
    .emblem { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
    .meta { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10.5px; }
    .val { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .sep { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10px; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="458" height="358" class="window-bg" filter="url(#panelGlow)" opacity="1">
    
  </rect>

  <!-- Terminal Window Header -->
