<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 46" width="100%" height="46">
  <defs>

    <!-- React Bits Ambient Moving Spotlight (Transparent Edge) -->
    <radialGradient id="spotlight_01" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
      <animate attributeName="cx" values="15%;85%;15%" dur="8s" repeatCount="indefinite" />
    </radialGradient>

    <!-- React Bits ShinyText Shimmer Gradient -->
    <linearGradient id="shine_01" x1="-120%" y1="0%" x2="180%" y2="0%">
      <stop offset="0%" stop-color="#8b949e" />
      <stop offset="35%" stop-color="#8b949e" />
      <stop offset="48%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#58a6ff" />
      <stop offset="65%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#8b949e" />
      <animate attributeName="x1" from="-140%" to="140%" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="280%" dur="4.2s" repeatCount="indefinite" />
    </linearGradient>

    <!-- React Bits ShinyText Light Scheme Shimmer Gradient -->
    <linearGradient id="shine_light_01" x1="-120%" y1="0%" x2="180%" y2="0%">
      <stop offset="0%" stop-color="#656d76" />
      <stop offset="35%" stop-color="#656d76" />
      <stop offset="48%" stop-color="#0969da" />
      <stop offset="52%" stop-color="#1f2328" />
      <stop offset="65%" stop-color="#656d76" />
      <stop offset="100%" stop-color="#656d76" />
      <animate attributeName="x1" from="-140%" to="140%" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="280%" dur="4.2s" repeatCount="indefinite" />
    </linearGradient>

    <!-- React Bits Laser Accent Beam -->
    <linearGradient id="laser_01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

  </defs>

  <style>
    .spotlight-rect { fill: url(#spotlight_01); }
    .prefix-sys { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #39d353; letter-spacing: 0.5px; }
    .prefix-mod { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #58a6ff; }
    .prefix-arrow { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #6e7681; }
    .title-text { font-family: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.6px; fill: url(#shine_01); }
    .laser-track { stroke: rgba(110, 118, 129, 0.25); stroke-width: 1.5px; }
    .laser-beam { stroke: url(#laser_01); stroke-width: 1.5px; }
    .terminal-cursor { fill: #39d353; }
    @media (prefers-color-scheme: light) {
      .prefix-sys { fill: #1a7f37; }
      .prefix-mod { fill: #0969da; }
      .prefix-arrow { fill: #656d76; }
      .title-text { fill: url(#shine_light_01); }
      .laser-track { stroke: rgba(31, 35, 40, 0.15); }
      .terminal-cursor { fill: #1a7f37; }
    }
  </style>

  <!-- Ambient Moving Spotlight (Transparent Canvas) -->
  <rect x="0" y="0" width="860" height="46" class="spotlight-rect" />

  <!-- Content Group -->
  <g transform="translate(16, 0)">
    <!-- Terminal Prompt Prefix -->
    <text x="0" y="26" class="prefix-sys">sys::mod</text>
    <text x="65" y="26" class="prefix-mod">[01]</text>
    <text x="98" y="26" class="prefix-arrow">&gt;</text>

    <!-- Shiny Heading Title -->
    <text x="118" y="26" class="title-text">TERMINAL PROFILE &amp; ASCII PORTRAIT</text>

    <!-- Blinking Terminal Cursor -->
    <rect class="terminal-cursor" x="466" y="13" width="7" height="16">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Laser Accent Track & Beam -->
  <line x1="16" y1="41" x2="844" y2="41" class="laser-track" />
  <line x1="16" y1="41" x2="844" y2="41" class="laser-beam" />
</svg>