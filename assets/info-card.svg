<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 626" width="540" height="626">
  <defs>
    <filter id="windowGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .window-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .title-bar { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
    .title-text { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .prompt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 500; }
    .emblem { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    .sep { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="538" height="624" class="window-bg" filter="url(#windowGlow)" />

  <!-- Terminal Window Header -->
  <path d="M 1 10 Q 1 1 10 1 L 530 1 Q 539 1 539 10 L 539 36 L 1 36 Z" class="title-bar" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#ff5f56" />
  <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="18" r="5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="270" y="22" text-anchor="middle" class="title-text">samrit@github: ~/neofetch</text>

  <!-- Terminal Body Content -->
    <text x="28" y="70" class="prompt" opacity="0"><tspan fill="#39d353">samrit@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">neofetch --profile</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.2s" fill="freeze"/></text>
    <text x="28" y="112" class="emblem" fill="#58a6ff" opacity="0">      .---.      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.45s" fill="freeze"/></text>
    <text x="28" y="130" class="emblem" fill="#58a6ff" opacity="0">     /     \     <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.50s" fill="freeze"/></text>
    <text x="28" y="148" class="emblem" fill="#58a6ff" opacity="0">    | () () |    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.55s" fill="freeze"/></text>
    <text x="28" y="166" class="emblem" fill="#58a6ff" opacity="0">     \  ^  /     <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.60s" fill="freeze"/></text>
    <text x="28" y="184" class="emblem" fill="#58a6ff" opacity="0">      |||||      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.65s" fill="freeze"/></text>
    <text x="28" y="202" class="emblem" fill="#58a6ff" opacity="0">      '---'      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.70s" fill="freeze"/></text>
    <text x="28" y="220" class="emblem" fill="#39d353" opacity="0">   [AI ENGINEER] <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.75s" fill="freeze"/></text>
    <text x="188" y="108" class="val" opacity="0"><tspan fill="#39d353" font-weight="700">samrit</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#58a6ff" font-weight="700">github</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.92s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="0.92s" fill="freeze"/></text>
    <text x="188" y="132" class="sep" fill="#30363d" opacity="0">--------------------------------------<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.04s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.04s" fill="freeze"/></text>
    <text x="188" y="156" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Education   </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#e6edf3">B.Tech CSE (AI &amp; ML)</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.16s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.16s" fill="freeze"/></text>
    <text x="188" y="180" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Institute   </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#8b949e">Meghnad Saha Inst. of Technology</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.28s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.28s" fill="freeze"/></text>
    <text x="188" y="204" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Focus       </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#39d353">AI/ML, Full-Stack, Agentic AI</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.40s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.40s" fill="freeze"/></text>
    <text x="188" y="228" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Languages   </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#e6edf3">Python, TypeScript, JavaScript, C/C++, Java</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.52s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.52s" fill="freeze"/></text>
    <text x="188" y="252" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Frameworks  </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#e6edf3">Next.js, Flask, React, HTML5/CSS3</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.64s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.64s" fill="freeze"/></text>
    <text x="188" y="276" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">AI &amp; Data</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#d2a8ff">LangChain, LangGraph, Hugging Face, Gemini</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.76s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.76s" fill="freeze"/></text>
    <text x="188" y="300" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Libraries   </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#8b949e">NumPy, Pandas, FAISS</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.88s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="1.88s" fill="freeze"/></text>
    <text x="188" y="324" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Cloud &amp; Ops</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#79c0ff">Docker, AWS, Vercel, Firebase, MongoDB</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.00s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="2.00s" fill="freeze"/></text>
    <text x="188" y="348" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Achievements</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#ffbd2e">11 Hackathon Wins</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.12s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="2.12s" fill="freeze"/></text>
    <text x="188" y="372" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Global Rank </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#e3b341">Top 106: Google Solution Challenge 2026</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.24s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="2.24s" fill="freeze"/></text>
    <text x="188" y="396" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">Portfolio   </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#58a6ff">https://samrit.dev/</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.36s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="2.36s" fill="freeze"/></text>
    <text x="188" y="420" class="meta" opacity="0"><tspan fill="#79c0ff" font-weight="600">LinkedIn    </tspan><tspan fill="#6e7681">: </tspan><tspan fill="#58a6ff">in/samrit-mukherjee</tspan><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.48s" fill="freeze"/><animate attributeName="transform" type="translate" values="5,0; 0,0" dur="0.2s" begin="2.48s" fill="freeze"/></text>
